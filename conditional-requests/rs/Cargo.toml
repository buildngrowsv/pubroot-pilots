[package]
name = "condreq"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-files = "0.6"
